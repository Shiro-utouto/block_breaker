<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Breaker Neo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden;background:#0c0d12}
canvas{display:block;margin:0 auto;background:#1b1d24}
#msg{color:#f3f3f3;text-align:center;font-family:'Helvetica Neue',sans-serif;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
button{font-size:1.2rem;padding:.5em 1.5em;border:none;border-radius:6px;background:#3498db;color:#fff}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="msg"><h1 id="st"></h1><button id="rs">Play Again</button></div>
<script>
(()=>{const cvs=document.getElementById('g'),ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight;cvs.width=W;cvs.height=H;
// Modern gradients & patterns
function padGradient(){const g=ctx.createLinearGradient(0,0,0,H*.02);g.addColorStop(0,'#4bbf5e');g.addColorStop(1,'#117e2f');return g;}
function brickGradient(c){const g=ctx.createLinearGradient(0,0,0,H*.03);g.addColorStop(0,'#fff');g.addColorStop(1,c);return g;}
// Game objects
const paddle={baseW:W/5,w:W/5,h:H/50,x:W/2-W/10,y:H-H/12,color:padGradient()};
const balls=[],bricks=[],particles=[],powerUps=[];
const rows=6,cols=8,pad=6,bW=(W-pad*(cols+1))/cols,bH=H/35,colors=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'];
let playing=true,wideTimer=0;
// Build bricks
function resetBricks(){bricks.length=0;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  bricks.push({x:pad+c*(bW+pad),y:H/9+r*(bH+pad),w:bW,h:bH,color:brickGradient(colors[r%colors.length]),alive:true});
 }}
function spawnBall(x,y){balls.push({x,y,r:H/80,vx:5*(Math.random()>.5?1:-1),vy:-5,color:'#eaeaea'});}
function spawnPowerUp(x,y){powerUps.push({x,y,w:32,h:18,type:Math.random()<.5?'WIDE':'MULTI',vy:2,clr:'#00e5ff'});}
function burst(x,y,c){
 for(let i=0;i<25;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,r:Math.random()*3+2,l:40,c});
}
// Draw
function draw(){
 ctx.clearRect(0,0,W,H);
 // bricks
 bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);}});
 // powerUps
 powerUps.forEach(p=>{ctx.fillStyle=p.clr;ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#000';ctx.font='14px sans-serif';ctx.fillText(p.type[0],p.x+9,p.y+14);});
 // paddle
 ctx.fillStyle=paddle.color;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
 // balls
 balls.forEach(b=>{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
 // particles
 particles.forEach(pt=>{ctx.globalAlpha=pt.l/40;ctx.fillStyle=pt.c;ctx.beginPath();
   ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
}
// Update
function update(){
 if(!playing)return;
 if(wideTimer>0){wideTimer--;if(wideTimer===0)paddle.w=paddle.baseW;}
 balls.forEach((b,bi)=>{
  b.x+=b.vx;b.y+=b.vy;
  if(b.x-b.r<0||b.x+b.r>W)b.vx*=-1;
  if(b.y-b.r<0)b.vy*=-1;
  if(b.y+b.r>=paddle.y&&b.x>paddle.x&&b.x<paddle.x+paddle.w){
   b.vy=-Math.abs(b.vy);
   b.vx=((b.x-(paddle.x+paddle.w/2))/(paddle.w/2))*7;
  }
  bricks.forEach(br=>{
   if(!br.alive)return;
   if(b.x>br.x&&b.x<br.x+br.w&&b.y-b.r<br.y+br.h&&b.y+b.r>br.y){
     br.alive=false;burst(b.x,b.y,colors[Math.floor(Math.random()*colors.length)]);
     if(Math.random()<.3)spawnPowerUp(br.x+br.w/2,br.y+br.h/2);
     b.vy*=-1;
   }
  });
  if(b.y-b.r>H)balls.splice(bi,1);
 });
 if(balls.length===0){end(false);return;}
 // powerUps
 powerUps.forEach((p,pi)=>{
  p.y+=p.vy;
  if(p.y+p.h>=paddle.y&&p.x+p.w>paddle.x&&p.x<paddle.x+paddle.w){
   if(p.type==='WIDE'){paddle.w=Math.min(paddle.w*1.7,W);wideTimer=60*10;}
   if(p.type==='MULTI'){spawnBall(p.x,p.y);spawnBall(p.x,p.y);}
   powerUps.splice(pi,1);
  }else if(p.y>H)powerUps.splice(pi,1);
 });
 // particles decay
 particles.forEach((pt,pi)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.l--;if(pt.l<=0)particles.splice(pi,1);});
 if(bricks.every(b=>!b.alive))end(true);
}
function end(win){playing=false;st.textContent=win?'YOU WIN':'GAME OVER';msg.style.display='block';}
function loop(){update();draw();requestAnimationFrame(loop);}loop();
// Controls
function move(x){paddle.x=x-paddle.w/2;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));}
cvs.addEventListener('touchmove',e=>{move(e.touches[0].clientX);e.preventDefault();},{passive:false});
cvs.addEventListener('mousemove',e=>move(e.clientX));
window.addEventListener('resize',()=>location.reload());
// UI
rs.addEventListener('click',()=>{init();msg.style.display='none';});
function init(){
 W=innerWidth;H=innerHeight;cvs.width=W;cvs.height=H;paddle.baseW=W/5;paddle.w=paddle.baseW;paddle.x=W/2-paddle.w/2;paddle.y=H-H/12;paddle.color=padGradient();
 balls.length=0;spawnBall(W/2,paddle.y-35);resetBricks();particles.length=0;powerUps.length=0;wideTimer=0;playing=true;
}
init();
})();
</script>
</body>
</html>
