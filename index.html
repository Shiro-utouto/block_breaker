<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Breaker+</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;padding:0;background:#111;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden}
canvas{display:block;margin:0 auto;background:#000}
#msg{color:#fff;text-align:center;font-family:sans-serif;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
button{font-size:1.2rem;padding:.5em 1em}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="msg"><h1 id="status"></h1><button id="restart">Play Again</button></div>
<script>
(()=>{const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;cvs.width=W;cvs.height=H;
// paddle
const paddle={baseW:W/5,w:W/5,h:H/50,x:W/2-W/10,y:H-H/12},balls=[];
const colors=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6'];
const bricks=[],rows=6,cols=8,pad=5,bW=(W-pad*(cols+1))/cols,bH=H/35;
const particles=[],powerUps=[];let playing=true,wideTimer=0;
// build
function resetBricks(){bricks.length=0;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
  bricks.push({x:pad+c*(bW+pad),y:H/10+r*(bH+pad),w:bW,h:bH,color:colors[r%colors.length],alive:true});
}
function spawnBall(x,y){balls.push({x,y,r:H/90,vx:4*(Math.random()>.5?1:-1),vy:-4});}
function spawnPowerUp(x,y){const list=['WIDE','MULTI'];powerUps.push({x,y,w:30,h:15,type:list[Math.random()<0.5?0:1],vy:2});}
function particlesBurst(x,y,c){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:3,l:30,c});}
// draw
function draw(){ctx.clearRect(0,0,W,H);
// bricks
bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);}});
// powerups
powerUps.forEach(p=>{ctx.fillStyle=p.type==='WIDE'?'#fff':'#0ff';ctx.fillRect(p.x,p.y,p.w,p.h);
 ctx.fillStyle='#000';ctx.fillText(p.type[0],p.x+8,p.y+12);});
// paddle
ctx.fillStyle='#0f0';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
// balls
ctx.fillStyle='#f00';balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
// particles
particles.forEach(pt=>{ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();});
}
// update
function update(){
 if(!playing)return;
 if(wideTimer>0){wideTimer--;if(wideTimer===0)paddle.w=paddle.baseW;}
 balls.forEach((b,bi)=>{
  b.x+=b.vx;b.y+=b.vy;
  if(b.x-b.r<0||b.x+b.r>W)b.vx*=-1;
  if(b.y-b.r<0)b.vy*=-1;
  if(b.y+b.r>=paddle.y&&b.x>paddle.x&&b.x<paddle.x+paddle.w){
   b.vy=-Math.abs(b.vy);
   b.vx=((b.x-(paddle.x+paddle.w/2))/(paddle.w/2))*6;
  }
  bricks.forEach(br=>{
   if(!br.alive)return;
   if(b.x>br.x&&b.x<br.x+br.w&&b.y-b.r<br.y+br.h&&b.y+b.r>br.y){
    br.alive=false;particlesBurst(b.x,b.y,br.color);if(Math.random()<.25)spawnPowerUp(br.x+br.w/2,br.y+br.h/2);
    b.vy*=-1;
   }
  });
  if(b.y-b.r>H)balls.splice(bi,1);
 });
 if(balls.length===0){end(false);return;}
 powerUps.forEach((p,pi)=>{
  p.y+=p.vy;
  if(p.y+p.h>=paddle.y&&p.x+p.w>paddle.x&&p.x<paddle.x+paddle.w){
   if(p.type==='WIDE'){paddle.w*=1.6;if(paddle.w>W)paddle.w=W;wideTimer=60*10;}
   if(p.type==='MULTI'){spawnBall(p.x,p.y);spawnBall(p.x,p.y);}
   powerUps.splice(pi,1);
  }else if(p.y>H)powerUps.splice(pi,1);
 });
 particles.forEach((pt,pi)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.l--;if(pt.l<=0)particles.splice(pi,1);});
 if(bricks.every(b=>!b.alive))end(true);
}
function end(win){playing=false;statusEl.textContent=win?'You Win!':'Game Over';msg.style.display='block';}
// loop
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
// input
function move(x){paddle.x=x-paddle.w/2;if(paddle.x<0)paddle.x=0;if(paddle.x+paddle.w>W)paddle.x=W-paddle.w;}
cvs.addEventListener('touchmove',e=>{move(e.touches[0].clientX);e.preventDefault();},{passive:false});
cvs.addEventListener('mousemove',e=>move(e.clientX));
window.addEventListener('resize',()=>location.reload());
// UI
const msg=document.getElementById('msg'),statusEl=document.getElementById('status');
document.getElementById('restart').addEventListener('click',()=>{
 W=window.innerWidth;H=window.innerHeight;cvs.width=W;cvs.height=H;
 paddle.baseW=W/5;paddle.w=paddle.baseW;paddle.x=W/2-paddle.w/2;paddle.y=H-H/12;
 balls.length=0;spawnBall(W/2,paddle.y-30);resetBricks();powerUps.length=0;particles.length=0;wideTimer=0;playing=true;msg.style.display='none';
});
spawnBall(W/2,paddle.y-30);resetBricks();
})();
</script>
</body>
</html>
