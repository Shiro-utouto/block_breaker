<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Breaker Plus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#111;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;margin:0 auto;background:#000}
  #hud{position:absolute;top:10px;left:0;width:100%;text-align:center;color:#fff;font-family:sans-serif;font-size:1.2rem;pointer-events:none}
  #msg{color:#fff;text-align:center;font-family:sans-serif;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
  button{font-size:1.2rem;padding:.5em 1em}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">0</span></div>
<div id="msg">
  <h1 id="status"></h1>
  <button id="restart">Play Again</button>
</div>
<script>
(()=>{
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
canvas.width=W;canvas.height=H;

// Entities
const paddle={w:W/5,h:H/50,x:W/2-W/10,y:H-H/12,speed:8,baseW:W/5,expandTimer:0};
const ball={r:H/80,x:W/2,y:paddle.y-H/80-1,vx:4*(Math.random()>0.5?1:-1),vy:-4};
let balls=[ball];
const rows=5,cols=7,brickPad=5,brickW=(W-brickPad*(cols+1))/cols,brickH=H/30;
let bricks=[];
let particles=[];
let powerups=[];
let score=0;
let playing=true;

// Build bricks
function buildBricks(){bricks=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      bricks.push({x:brickPad+c*(brickW+brickPad),y:H/10+r*(brickH+brickPad),
                   w:brickW,h:brickH,alive:true,hits:1+Math.floor(r/2)});
    }
  }
}
buildBricks();

// Utility
function rand(min,max){return Math.random()*(max-min)+min;}

// Particles
function addParticle(x,y,color){
  particles.push({x,y,vx:rand(-1,1),vy:rand(-1,1),life:20,color});
}

// Power-ups
function spawnPowerup(x,y){
  const types=['expand','multiball'];
  const t=types[Math.floor(Math.random()*types.length)];
  powerups.push({x,y,w:ball.r*2,h:ball.r*2,type:t,vy:2});
}

// Update loop
function update(){
  if(!playing)return;
  // Update paddle expand timer
  if(paddle.expandTimer>0){
    paddle.expandTimer--;
    if(paddle.expandTimer===0)paddle.w=paddle.baseW;
  }
  // Update balls
  balls.forEach((b,i)=>{
    b.x+=b.vx;b.y+=b.vy;
    // Walls
    if(b.x-b.r<0||b.x+b.r>W)b.vx*=-1;
    if(b.y-b.r<0)b.vy*=-1;
    // Paddle
    if(b.y+b.r>=paddle.y && b.x>paddle.x && b.x<paddle.x+paddle.w){
      b.vy*=-1;
      const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      b.vx=hit*5;
    }
    // Bricks
    bricks.forEach(br=>{
      if(!br.alive)return;
      if(b.x>br.x&&b.x<br.x+br.w&&b.y-b.r<br.y+br.h&&b.y+b.r>br.y){
        b.vy*=-1;
        br.hits--;
        score+=10;
        addParticle(b.x,b.y,'#fff');
        if(Math.random()<0.2)spawnPowerup(br.x+br.w/2,br.y+br.h/2);
        if(br.hits<=0){br.alive=false;score+=40;}
      }
    });
    // Lose ball
    if(b.y-b.r>H){balls.splice(i,1);}
  });
  if(balls.length===0)endGame(false);
  if(bricks.every(b=>!b.alive))endGame(true);

  // Update particles
  particles=particles.filter(p=>p.life-->0).map(p=>(p.x+=p.vx,p.y+=p.vy,p));

  // Update powerups
  powerups.forEach((p,i)=>{
    p.y+=p.vy;
    if(p.y>H)powerups.splice(i,1);
    else if(p.y+p.h>=paddle.y && p.x>paddle.x && p.x<paddle.x+paddle.w){
      applyPowerup(p.type);
      powerups.splice(i,1);
    }
  });

  document.getElementById('score').textContent=score;
}

// Apply powerup
function applyPowerup(type){
  switch(type){
    case 'expand':
      paddle.w=paddle.baseW*1.6;
      paddle.expandTimer=60*8; // 8 seconds
      break;
    case 'multiball':
      const nb={...ball,x:ball.x,y:ball.y,vx:-ball.vx,vy:ball.vy};
      balls.push(nb);
      break;
  }
}

// Draw loop
function draw(){
  ctx.clearRect(0,0,W,H);
  // Bricks
  bricks.forEach(br=>{
    if(!br.alive)return;
    ctx.fillStyle=['#09f','#0df','#0ff'][br.hits-1]||'#0ff';
    ctx.fillRect(br.x,br.y,br.w,br.h);
  });
  // Paddle
  ctx.fillStyle='#0f0';
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  // Balls
  balls.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#f00';ctx.fill();
  });
  // Particles
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,2,2);
  });
  // Powerups
  powerups.forEach(p=>{
    ctx.fillStyle=p.type==='expand'?'#ff0':'#f0f';
    ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);
  });
}

function endGame(win){
  playing=false;
  document.getElementById('status').textContent=win?'You Win!':'Game Over';
  document.getElementById('msg').style.display='block';
}

// Main loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Input
function movePaddle(clientX){
  paddle.x=clientX-paddle.w/2;
  if(paddle.x<0)paddle.x=0;
  if(paddle.x+paddle.w>W)paddle.x=W-paddle.w;
}
canvas.addEventListener('touchmove',e=>{movePaddle(e.touches[0].clientX);e.preventDefault();},{passive:false});
canvas.addEventListener('mousemove',e=>movePaddle(e.clientX));
window.addEventListener('resize',()=>location.reload());
document.getElementById('restart').addEventListener('click',()=>location.reload());
})();
</script>
</body>
</html>
