<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Block Breaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#111;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;margin:0 auto;background:#000}
  #msg{color:#fff;text-align:center;font-family:sans-serif;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none}
  button{font-size:1.2rem;padding:.5em 1em}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="msg">
  <h1 id="status"></h1>
  <button id="restart">Play Again</button>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  // Paddle
  const paddle = {
    w: W/5,
    h: H/50,
    x: W/2 - W/10,
    y: H - H/12,
    speed: 8
  };

  // Ball
  const ball = {
    r: H/80,
    x: W/2,
    y: paddle.y - H/80 - 1,
    vx: 4 * (Math.random()>0.5?1:-1),
    vy: -4
  };

  // Bricks
  const rows = 5, cols = 7;
  const brickPadding = 5;
  const brickW = (W - brickPadding*(cols+1)) / cols;
  const brickH = H/30;
  let bricks = [];
  function buildBricks(){
    bricks=[];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        bricks.push({x: brickPadding + c*(brickW+brickPadding),
                     y: H/10 + r*(brickH+brickPadding),
                     w: brickW,
                     h: brickH,
                     alive:true});
      }
    }
  }
  buildBricks();

  let playing = true;

  function draw(){
    ctx.clearRect(0,0,W,H);

    // Draw paddle
    ctx.fillStyle = '#0f0';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Draw ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#f00';
    ctx.fill();
    ctx.closePath();

    // Draw bricks
    ctx.fillStyle='#09f';
    bricks.forEach(b=>{
      if(b.alive)
        ctx.fillRect(b.x,b.y,b.w,b.h);
    });
  }

  function update(){
    if(!playing) return;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // wall collision
    if(ball.x-ball.r<0 || ball.x+ball.r>W) ball.vx*=-1;
    if(ball.y-ball.r<0) ball.vy*=-1;

    // paddle collision
    if(ball.y+ball.r>=paddle.y && ball.x>paddle.x && ball.x< paddle.x+paddle.w){
      ball.vy*=-1;
      // tweak horizontal velocity based on hit position
      let hitPos = (ball.x - (paddle.x+paddle.w/2)) / (paddle.w/2);
      ball.vx = hitPos*5;
    }

    // bricks collision
    bricks.forEach(b=>{
      if(!b.alive) return;
      if(ball.x> b.x && ball.x< b.x+b.w && ball.y-ball.r< b.y+b.h && ball.y+ball.r> b.y){
        ball.vy*=-1;
        b.alive=false;
      }
    });

    // lose condition
    if(ball.y-ball.r>H){
      endGame(false);
    }

    // win condition
    if(bricks.every(b=>!b.alive)){
      endGame(true);
    }
  }

  function endGame(win){
    playing=false;
    document.getElementById('status').textContent = win ? 'You Win!' : 'Game Over';
    document.getElementById('msg').style.display='block';
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();

  // Input handling
  function movePaddle(clientX){
    paddle.x = clientX - paddle.w/2;
    if(paddle.x<0) paddle.x=0;
    if(paddle.x+paddle.w>W) paddle.x=W-paddle.w;
  }
  canvas.addEventListener('touchmove',e=>{
    movePaddle(e.touches[0].clientX);
    e.preventDefault();
  },{passive:false});
  canvas.addEventListener('mousemove',e=>movePaddle(e.clientX));
  window.addEventListener('resize', ()=>{
    location.reload();
  });

  document.getElementById('restart').addEventListener('click',()=>{
    // reset
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    paddle.w = W/5;
    paddle.h = H/50;
    paddle.x = W/2 - paddle.w/2;
    paddle.y = H - H/12;
    ball.x = W/2;
    ball.y = paddle.y - ball.r -1;
    ball.vx = 4*(Math.random()>0.5?1:-1);
    ball.vy = -4;
    buildBricks();
    playing=true;
    document.getElementById('msg').style.display='none';
  });
})();
</script>
</body>
</html>
